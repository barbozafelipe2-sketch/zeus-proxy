name: Zeus Proxy Live Smoke
on:
  workflow_dispatch:
    inputs:
      confirm_paid_ai:
        description: 'Type yes-spend-credits to run one real, paid provider request'
        required: false
        default: 'no'
        type: string
      write_probe:
        description: 'Run the database/blob probe without AI'
        required: false
        default: true
        type: boolean
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: gate
        name: Check smoke configuration
        shell: bash
        env:
          BASE: ${{ secrets.ZEUS_PROXY_SMOKE_BASE_URL }}
        run: |
          if [ -n "$BASE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Smoke base URL is not configured; skipping live production probe."
          fi
      - name: Live production smoke
        if: steps.gate.outputs.ready == 'true'
        run: npm run smoke:live
        env:
          ZEUS_PROXY_SMOKE_BASE_URL: ${{ secrets.ZEUS_PROXY_SMOKE_BASE_URL }}
          ZEUS_PROXY_SMOKE_WRITE: ${{ inputs.write_probe && '1' || '0' }}
          ZEUS_PROXY_SMOKE_AI: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm_paid_ai == 'yes-spend-credits') && '1' || '0' }}
