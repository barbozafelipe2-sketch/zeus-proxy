name: Zeus Proxy Live Smoke
on:
  workflow_dispatch:
    inputs:
      test_ai:
        description: 'Run one real Zeus provider turn'
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '17 13 * * 1'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: gate
        name: Check smoke configuration
        shell: bash
        env:
          BASE: ${{ secrets.ZEUS_PROXY_SMOKE_BASE_URL }}
          ACCESS: ${{ secrets.ZEUS_PROXY_SMOKE_ACCESS_TOKEN }}
        run: |
          if [ -n "$BASE" ] && [ ${#ACCESS} -ge 32 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Smoke secrets are not configured; skipping live production probe."
          fi
      - name: Live production smoke
        if: steps.gate.outputs.ready == 'true'
        run: npm run smoke:live
        env:
          ZEUS_PROXY_SMOKE_BASE_URL: ${{ secrets.ZEUS_PROXY_SMOKE_BASE_URL }}
          ZEUS_PROXY_SMOKE_ACCESS_TOKEN: ${{ secrets.ZEUS_PROXY_SMOKE_ACCESS_TOKEN }}
          ZEUS_PROXY_SMOKE_WRITE: '1'
          ZEUS_PROXY_SMOKE_AI: ${{ github.event_name == 'schedule' && '1' || (inputs.test_ai && '1' || '0') }}
